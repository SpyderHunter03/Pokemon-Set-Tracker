# Push to main → CI (the existing workflow) runs the full end-to-end suite →
# when it comes up green, this deploys the hosted tracker to its box.
#
# Differences from the card API's deploy, on purpose:
#   - It chains off CI via workflow_run instead of re-running the suite —
#     CI already runs on every push to main, and the tracker's suite is the
#     expensive kind (Playwright + a real browser). No box is touched unless
#     that run succeeded, and workflow_dispatch remains for redeploying the
#     current main by hand.
#   - ONE host, not a list. The tracker is single-home by design: accounts,
#     collections and binders are one SQLite database with no replication
#     story, so there is nothing to roll out serially. (DEPLOYMENT.md,
#     "Hosting on the API's Vultr box".)
#
# The on-box contract lives in deploy/deploy-node.sh: update, restart,
# verify /api/app-config reports exactly the deployed commit, roll back to
# the previous commit if it does not. Either way the box ends on one
# working version. User data is never at risk: it lives in
# /var/lib/ptcg-tracker, outside anything git reset touches.
#
# Two repository secrets make it live (with them unset, this says so and
# exits green):
#   DEPLOY_SSH_KEY — private key whose public half is on the box; the same
#                    keypair the API repo uses is fine (same box, one door)
#   DEPLOY_HOST    — the box's IP (east)

name: deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: deploy-tracker
  cancel-in-progress: false

jobs:
  deploy:
    # dispatch deploys current main; a CI completion deploys only if that CI
    # run was a SUCCESS on MAIN (dev pushes and failed runs fall through)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # deploy the EXACT commit CI tested, with ITS copy of the deploy
          # script — not whatever main has become in the meantime
          ref: ${{ env.SHA }}

      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "DEPLOY_SSH_KEY not set — nothing to deploy to. Skipping."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Deploy
        run: |
          if [ -z "$HOST" ]; then
            echo "DEPLOY_HOST not set — nothing to deploy to. Skipping."
            exit 0
          fi
          if ssh -i ~/.ssh/id_deploy \
                 -o StrictHostKeyChecking=accept-new \
                 -o ConnectTimeout=10 \
                 "root@$HOST" \
                 "TARGET_SHA=$SHA bash -s" < deploy/deploy-node.sh; then
            echo "Tracker is on $SHA."
          else
            echo "::error::Deploy failed — the box was rolled back to its previous version."
            exit 1
          fi
